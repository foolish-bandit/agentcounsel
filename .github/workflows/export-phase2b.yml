name: Export Phase 2B branch

on:
  push:
    branches:
      - feat/phase-2b-selective-modules

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Archive branch
        run: git archive --format=zip --output=phase2b-branch.zip HEAD
      - name: Upload branch archive
        uses: actions/upload-artifact@v4
        with:
          name: phase2b-branch
          path: phase2b-branch.zip
          retention-days: 1
