name: Apply Phase 2B implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/phase-2b-selective-modules' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/phase-2b-selective-modules
          fetch-depth: 0

      - name: Reconstruct and verify implementation patch
        run: |
          git show origin/release/v0.3.0-selective-context:.patch-transfer/part-00.b64 > /tmp/part-00.b64
          git show origin/release/v0.3.0-selective-context:.patch-transfer/part-01.b64 > /tmp/part-01.b64
          cat /tmp/part-00.b64 /tmp/part-01.b64 | base64 --decode | gzip --decompress > /tmp/phase2b.patch
          echo "e06b408f604aaa3fab79db941493b9387e3cb0ecf52addf9104252743b65e380  /tmp/phase2b.patch" | sha256sum --check
          test "$(wc -c < /tmp/phase2b.patch)" -eq 400758

      - name: Apply verified local implementation
        run: |
          git apply --index --binary /tmp/phase2b.patch
          rm -f .github/phase2b.patch.xz.b64
          rm -f .github/workflows/apply-phase2b.yml
          rm -f .github/workflows/export-phase2b.yml
          rm -f .github/workflows/export-workspace.yml
          git add -A
          git diff --cached --check
          git status --short

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: complete Phase 2B selective context and provenance"
          git push origin HEAD:feat/phase-2b-selective-modules
