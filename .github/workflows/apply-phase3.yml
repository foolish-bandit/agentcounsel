name: Apply Phase 3 matter graphs

on:
  push:
    branches:
      - feat/phase-3-matter-graphs

permissions:
  contents: write

concurrency:
  group: apply-phase3
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/phase-3-matter-graphs
          fetch-depth: 0

      - name: Reconstruct and verify release-candidate patch
        shell: bash
        run: |
          set -euo pipefail
          git show origin/chore/phase3-patch-transport:.phase3-transfer/part-000.b64 | head -c 12000 > /tmp/p00
          git show origin/chore/phase3-patch-transport:.phase3-transfer/part-001.b64 | head -c 12000 > /tmp/p01
          git show origin/chore/phase3-patch-transport:.phase3-transfer/part-002.b64 | head -c 12000 > /tmp/p02
          git show origin/chore/phase3-patch-transport:.phase3-transfer/tail-00.b64 | head -c 4000 > /tmp/p03
          git show origin/chore/phase3-patch-transport:.phase3-transfer/tail-01.b64 | head -c 4000 > /tmp/p04
          git show origin/chore/phase3-patch-transport:.phase3-transfer/tail-02.b64 | head -c 8000 > /tmp/p05
          git show origin/chore/phase3-patch-transport:.phase3-transfer/tail-03a.b64 | head -c 4000 > /tmp/p06
          git show origin/chore/phase3-patch-transport:.phase3-transfer/tail-03b.b64 | head -c 4000 > /tmp/p07
          git show origin/chore/phase3-patch-transport:.phase3-transfer/tail-04.b64 | head -c 8000 > /tmp/p08
          git show origin/chore/phase3-patch-transport:.phase3-transfer/tail-05.b64 | head -c 7776 > /tmp/p09
          cat /tmp/p{00..09} > /tmp/phase3.patch.xz.b64
          test "$(wc -c < /tmp/phase3.patch.xz.b64)" -eq 75776
          echo "98ebf53cfa6fdc0c940449f26a7be54eb6ad80653d78330bc3c53b115133aceb  /tmp/phase3.patch.xz.b64" | sha256sum --check
          base64 --decode /tmp/phase3.patch.xz.b64 > /tmp/phase3.patch.xz
          test "$(wc -c < /tmp/phase3.patch.xz)" -eq 56832
          echo "5dbb07b2679f8510e99d5c96195deb6a7d7fb0531f4a86640482b01aea8d7d55  /tmp/phase3.patch.xz" | sha256sum --check
          xz --decompress --stdout /tmp/phase3.patch.xz > /tmp/phase3.patch
          echo "94bb6a1b03b2157f6cc84e6e862fd94a6eabf9d057b9c318b6e9b94ac9f1052e  /tmp/phase3.patch" | sha256sum --check
          git apply --check --binary /tmp/phase3.patch

      - name: Apply non-workflow implementation changes
        shell: bash
        run: |
          set -euo pipefail
          git apply --index --binary /tmp/phase3.patch
          git restore --source=HEAD --staged --worktree .github/workflows/validate.yml
          git restore --source=HEAD --staged --worktree .github/workflows/export-phase3.yml
          git add -A
          git diff --cached --check
          git status --short

      - name: Commit and push implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add typed matter plans and auditable graph execution"
          git push origin HEAD:feat/phase-3-matter-graphs
